[package]
name = "stdlib"
version.workspace = true
edition.workspace = true
description = "Standard Library Unifikasi untuk RPL - shared implementation antara interpreter dan VM"
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["enterprise"]
enterprise = [
    "dep:dotenvy",
    "dep:ureq",
    "dep:http",
    "dep:docx-rs",
    "dep:genpdf",
    "dep:pdf-extract",
    "dep:calamine",
    "dep:zip",
    "dep:quick-xml",
    "dep:lettre",
    "dep:jsonwebtoken"
]

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = "0.10"
md5 = "0.7"
rand = "0.8"
chrono = "0.4"
regex = "1.13.1"
lazy_static = "1.5.0"

# Enterprise Optional Dependencies
dotenvy = { version = "0.15", optional = true }
ureq = { version = "3", optional = true }
http = { version = "1", optional = true }
docx-rs = { version = "0.4.22", optional = true }
genpdf = { version = "0.2.0", optional = true }
pdf-extract = { version = "0.12.0", optional = true }
calamine = { version = "0.36.1", optional = true }
zip = { version = "8.6.0", optional = true }
quick-xml = { version = "0.41.0", optional = true }
lettre = { version = "0.11.23", features = ["builder", "smtp-transport", "native-tls"], optional = true }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
