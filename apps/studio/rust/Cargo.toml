[workspace]

[package]
name = "rust_lib_rpl_studio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
runtime = { git = "https://github.com/resitdc/indonesia-programming-language", tag = "v5.0.0" }
flutter_rust_bridge = "=2.12.0"

[profile.release]
lto = true
opt-level = "s"
strip = true
