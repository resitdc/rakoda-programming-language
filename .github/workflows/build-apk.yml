name: Build RPL Studio APK

on:
  push:
    tags:
      - 'studio-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 📦 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Get Flutter dependencies
        working-directory: apps/studio
        run: flutter pub get

      - name: 🔐 Decode Keystore
        working-directory: apps/studio/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo $KEYSTORE_BASE64 | base64 --decode > upload-keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
            echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
            echo "storeFile=upload-keystore.jks" >> key.properties
          fi

      - name: 🏗️ Build APK
        working-directory: apps/studio
        run: flutter build apk --release

      - name: 🏷️ Get App Version and Rename
        working-directory: apps/studio
        run: |
          APP_VERSION=$(grep '^version: ' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d '+' -f 1)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/RPL-Studio-v${APP_VERSION}.apk

      - name: 📤 Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/studio/build/app/outputs/flutter-apk/RPL-Studio-v${{ env.APP_VERSION }}.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpl-studio-apk
          path: apps/studio/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
