name: Build RPL Studio Linux

on:
  push:
    tags:
      - 'studio-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: 🐧 Build Linux App
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔧 Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: 📦 Get dependencies
        working-directory: apps/studio
        run: flutter pub get

      - name: 🏗️ Build Linux app
        working-directory: apps/studio
        run: flutter build linux --release

      - name: 🏷️ Get App Version and Compress
        working-directory: apps/studio
        run: |
          APP_VERSION=$(grep '^version: ' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d '+' -f 1)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          tar -czvf RPL-Studio-v${APP_VERSION}-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: 📤 Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/studio/RPL-Studio-v${{ env.APP_VERSION }}-linux.tar.gz

      - name: 📤 Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpl-studio-linux
          path: apps/studio/RPL-Studio-v${{ env.APP_VERSION }}-linux.tar.gz
          retention-days: 7
